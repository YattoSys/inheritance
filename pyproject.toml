[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-inheritance-rbac"
version = "0.1.0"
description = "Una extension de Flask para gestionar RBAC con herencia de roles."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Kirito", email = "agarcia@aglabs.com"}
]
keywords = ["flask", "rbac", "roles y permisos", "herencia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/YattoSys/inheritance"
"Bug Tracker" = "https://github.com/YattoSys/inheritance/issues"

# Configuración para encontrar el paquete dentro de la carpeta 'src'
[tool.setuptools.packages.find]
where = ["src"]
include = ["inheritance*"]  # Esto busca la carpeta que contiene el código real